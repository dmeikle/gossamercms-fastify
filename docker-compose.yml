services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: gossamer
      MYSQL_USER: gossamer
      MYSQL_PASSWORD: gossamer
      MYSQL_DATABASE: gossamercms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u gossamer -pgossamer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: mysql://gossamer:gossamer@mysql:3306/gossamercms
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  app_node_modules:
